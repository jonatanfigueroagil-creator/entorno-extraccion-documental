# Configuración del pipeline_sbs (se amplía en cada sesión).
# Sin rutas absolutas ni secretos: las rutas son siempre relativas al lugar de trabajo.

ocr:
  idioma: spa            # código de idioma de Tesseract (datos "spa")
  tesseract_cmd: ""      # S03: ruta de tesseract.exe; vacío = variable TESSERACT_CMD, PATH o carpeta estándar de Windows
  lang: spa              # S03: idioma que usa pytesseract
  oem: 1                 # S03: motor de Tesseract (1 = red neuronal LSTM)
  psm: 6                 # S03: modo de segmentación; 6 = un bloque uniforme de texto
  psm_pagina: 3          # S03: modo para páginas con varias columnas o zonas (se compara con psm en el LAB)
  dpi: 300               # S03: resolución al pasar el PDF a imagen
  receta: mediana         # S03: receta de limpieza de la imagen (crudo | gris | otsu | adaptativa | mediana)
  dpi_llm: 200           # S05: resolución de la página que se envía a glm-ocr (a 200 dpi ocupa unos 4.000 tokens)
  paddle:                # PaddleOCR 3.x en CPU (S02 lo prueba con una imagen; S03 lo amplía)
    idioma: es
    modelo_deteccion: PP-OCRv5_mobile_det          # modelos ligeros: ~1 s por imagen frente a ~14 s con los de serie
    modelo_reconocimiento: latin_PP-OCRv5_mobile_rec
    enable_mkldnn: false                           # necesario en CPU con paddlepaddle 3.3.1 (si no, falla en la primera predicción)

ingesta:
  extensiones:           # extensiones que el pipeline acepta en una carpeta de entrada
    - ".pdf"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".tif"
    - ".eml"
    - ".docx"
    - ".html"
  carpeta_cuarentena: cuarentena            # S02: aquí se copian los archivos que fallan (junto con su motivo)
  umbral_ocr_caracteres_por_pagina: 20      # S02: menos caracteres por página => el PDF requiere OCR (se calibra con el corpus)
  hash: sha256                              # S02: huella del contenido para detectar duplicados

calidad:
  umbral_score: 0.85     # S03: puntaje mínimo para aceptar una lectura sin revisión humana
  umbral_f1: 0.80        # S04: F1 mínimo por campo (provisional; se fija con las mediciones de la VM)

extraccion:              # S04: texto, reglas, NER y adjuntos de los correos
  modelo_spacy: es_core_news_md        # modelo de spaCy (respaldo: es_core_news_sm)
  modelo_spacy_respaldo: es_core_news_sm
  modelo_ner: Davlan/xlm-roberta-base-ner-hrl   # NER de Transformers (etiquetas PER, ORG, LOC y DATE)
  dispositivo: auto      # auto | cpu | cuda (auto usa la GPU si existe)
  receta_adjunto: crudo  # limpieza de la imagen del adjunto (la receta mediana borra el texto pequeño)
  enderezar_adjunto: false
  psm_adjunto: 3         # segmentación del OCR del adjunto: 3 = página con varias zonas (psm_pagina de S03)
  carpeta_lote_real: curso/datos/14_Publico_Real   # lote público real (solo lectura), relativo a la unidad del sistema

clasificacion:           # S04: motivo del reclamo
  modelo_zero_shot: MoritzLaurer/mDeBERTa-v3-base-mnli-xnli
  plantilla_hipotesis: "Este reclamo trata de {}."
  etiquetas_motivo:
    - cobro indebido
    - consumo no reconocido
    - demora en entrega
    - cargo duplicado
    - cuenta cerrada
    - tasa distinta
  semilla: 2026
  pliegues: 5
  umbral_confianza: 0.30 # probabilidad mínima del motivo para no pasar a revisión (validación cruzada: con 0,30 pasan 45 de 60 y los 45 aciertan)

llm:                     # S05: modelos de lenguaje locales con Ollama
  backend: ollama_local  # ollama_local (la VM) | servidor_compartido (OLLAMA_HOST) | api_nube (no se usa: ningún documento sale)
  modelo: qwen3.5:4b     # modelo principal de extracción
  modelo_grande: qwen3.5:9b   # modelo para comparar
  modelo_ocr: glm-ocr    # OCR local con un modelo de visión
  num_ctx: 12288         # contexto de cada llamada: el contrato más largo cabe entero (con 4096, el de serie, se corta sin aviso)
  num_ctx_ocr: 8192      # contexto del OCR: la imagen de una página a 200 dpi ocupa unos 4.000 tokens
  num_predict: 1000      # tope de tokens de salida (sin tope, una llamada generó 63.000)
  temperatura: 0         # reduce la variación entre corridas; no garantiza la misma salida
  semilla: 2026
  prompt_nivel: 5        # partes del prompt: 1 Tarea, 2 + Rol, 3 + Contexto, 4 + Formato, 5 + un ejemplo resuelto
  ejemplos: config/ejemplos_prompt.json   # un ejemplo resuelto por tipo (se trae del repositorio; ruta dentro del paquete)

orquestacion:            # S06: cómo se ejecuta un lote
  modo: procesos         # secuencial (un archivo tras otro) | procesos (varios a la vez)
  trabajadores: 4        # procesos a la vez; como máximo, los procesadores lógicos de la VM
  etapas: [control, ingesta, ocr, pln]   # se recorren en este orden; quitar una la salta
  motor_ocr: tesseract   # motor de la etapa ocr
  tipo_por_prefijo:      # tipo de documento según el prefijo del nombre del archivo
    POL: poliza
    CON: contrato
    OFI: oficio
    EFI: estado_financiero
    REC: reclamo
    VOU: voucher
    TAR: tarifario
    LOT: estado_financiero

reintentos:              # S06: solo ante errores transitorios (archivo bloqueado)
  intentos: 3            # repeticiones después de la primera llamada
  espera_s: [1, 2, 4]    # segundos antes de cada repetición

cuarentena:              # S06: lo que no se pudo procesar se aparta con su motivo
  carpeta: cuarentena

almacenamiento:          # S06: dónde quedan los resultados (rutas relativas a la carpeta de trabajo)
  duckdb: salidas/resultados.duckdb
  parquet: salidas/parquet
  reporte: salidas/reporte.html

monitoreo:               # S07: el libro de actas (registro) y el tablero de alertas
  registro: registro.jsonl       # un evento JSON por línea, en la carpeta de salida de la corrida
  umbral_errores: 0.05           # alerta si falla más del 5 % de los documentos
  revision_linea_base: 0.27      # % de documentos que van a revisión en una corrida normal (15 pólizas: 26,7 %)
  factor_revision: 2             # alerta si la revisión pasa del doble de la línea base
  minimo_caracteres_pagina: 200  # un PDF digital con menos caracteres por página va a revisión (puede estar truncado)

sinonimos_rotulos:       # S07 (caso): rótulo de un formato nuevo -> rótulo de siempre; solo llena campos vacíos
  poliza:
    "Nro. de poliza -": "Poliza:"
    "Compania de seguros -": "Aseguradora:"
    "RUC de la compania -": "RUC"
    "Titular del seguro -": "Asegurado"
    "Documento de identidad -": "DNI"
    "Linea de seguro -": "Ramo"
    "Capital asegurado -": "Suma asegurada"
    "Prima total -": "Prima anual"
    "Inicio de cobertura -": "Vigencia desde"
    "Fin de cobertura -": "Vigencia hasta"
    "Beneficiario designado -": "Beneficiario"
    "Franquicia -": "Deducible"

logging:
  nivel: INFO            # DEBUG | INFO | WARNING | ERROR
  formato: json          # S02: una línea JSON por evento (simple | json)
